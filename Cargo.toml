[package]
name = "make-language-server"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
streaming-iterator = "0.1"
tree-sitter = "0.24"
tree-sitter-make = { git = "https://github.com/make-language-server/tree-sitter-make" }
